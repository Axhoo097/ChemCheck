services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chemcheck
      POSTGRES_PASSWORD: chemcheck
      POSTGRES_DB: chemcheck
    ports:
      - "5432:5432"
    volumes:
      - chemcheck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemcheck -d chemcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (optional score cache) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI application ───────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://chemcheck:chemcheck@db:5432/chemcheck
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # entrypoint.sh (baked into the image) runs alembic upgrade head first.
    # No volume mount in production — prevents accidentally shadowing the image's
    # compiled assets with a local dev tree. Remove this comment for live-reload
    # during local development and uncomment the volume below instead.
    # volumes:
    #   - .:/code

volumes:
  chemcheck_pgdata:
